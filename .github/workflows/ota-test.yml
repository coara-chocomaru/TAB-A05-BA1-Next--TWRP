name: Reboot OTA ZIP Builder (Signed with testkey)

on:
  push:
    branches:
      - yoko
  workflow_dispatch:

env:
  DEVICE_NAME: 'a05ba'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Create OTA ZIP structure
        run: |
          mkdir -p workspace/zip_root/META-INF/com/google/android

      - name: Create update-binary (shell script)
        run: |
          cat > workspace/zip_root/META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          ui_print() { echo "ui_print $*" > /proc/self/fd/1; echo "ui_print" > /proc/self/fd/1; }
          ui_print "***********************************************"
          ui_print "*  Reboot to Bootloader (Signed ZIP)         *"
          ui_print "***********************************************"
          reboot bootloader || /sbin/reboot bootloader || setprop sys.powerctl reboot,bootloader || /system/bin/reboot bootloader
          ui_print "ERROR: All reboot methods failed!"
          exit 1
          EOF
          chmod 755 workspace/zip_root/META-INF/com/google/android/update-binary

      - name: Create dummy updater-script
        run: |
          echo "# dummy" > workspace/zip_root/META-INF/com/google/android/updater-script

      - name: Package unsigned ZIP
        run: |
          cd workspace/zip_root
          zip -r9 ../reboot-bootloader-unsigned.zip .
          cd ..
          ls -la reboot-bootloader-unsigned.zip

      # ★★★ ここが修正済みの署名ステップ ★★★
      - name: Sign ZIP with testkey (reliable download)
        run: |
          mkdir -p tools keys

          # signapk.jar を LineageOS ミラーから取得（確実）
          wget -q -O tools/signapk.jar https://github.com/LineageOS/android_prebuilts_sdk/raw/lineage-20.0/tools/lib/signapk.jar || {
            echo "LineageOS mirror failed, trying AOSP ZIP..."
            wget -q -O tools/signapk.zip https://android.googlesource.com/platform/prebuilts/sdk/+archive/refs/heads/master/tools/lib/signapk.jar?format=ZIP
            unzip -p tools/signapk.zip signapk.jar > tools/signapk.jar
          }

          # testkey を LineageOS ミラーから取得（確実）
          wget -q -O keys/testkey.x509.pem https://raw.githubusercontent.com/LineageOS/android_build/lineage-20.0/target/product/security/testkey.x509.pem
          wget -q -O keys/testkey.pk8 https://raw.githubusercontent.com/LineageOS/android_build/lineage-20.0/target/product/security/testkey.pk8

          # ファイル確認
          echo "=== 取得ファイル確認 ==="
          ls -la tools/signapk.jar keys/testkey.*
          file tools/signapk.jar

          # 署名実行
          java -jar tools/signapk.jar keys/testkey.x509.pem keys/testkey.pk8 \
            workspace/reboot-bootloader-unsigned.zip \
            workspace/reboot-bootloader-signed.zip

          # 検証
          echo "=== 署名済みZIP内容 ==="
          unzip -l workspace/reboot-bootloader-signed.zip | head -20

      - name: Upload signed OTA ZIP to Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: workspace/reboot-bootloader-signed.zip
          name: ${{ env.DEVICE_NAME }}-reboot-ota-signed-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            **testkey 署名済み OTA ZIP (reboot-bootloader)**
            - `update-binary` はシェルスクリプト
            - 署名: AOSP testkey
            - AOSPリカバリー / TWRP 両対応
