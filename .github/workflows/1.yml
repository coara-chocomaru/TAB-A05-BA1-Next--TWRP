name: Re

on:
  push:
    branches:
      - yoko  # 実行するブランチを指定

env:
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
  MANIFEST_BRANCH: 'twrp-9.0'
  DEVICE_TREE_URL: 'https://github.com/coara-chocomaru/test-ctab'
  DEVICE_TREE_BRANCH: 'yoko'
  DEVICE_PATH: 'device/sts/a05ba'
  DEVICE_NAME: 'a05ba'
  MAKEFILE_NAME: 'omni_a05ba'
  BUILD_TARGET: 'recovery'
  # COMMON_TREE_URL と COMMON_PATH を必要に応じて指定してください

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ env.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ env.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ env.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ env.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ env.DEVICE_PATH }}"
          echo "Device Name: ${{ env.DEVICE_NAME }}"
          echo "Makefile Name: ${{ env.MAKEFILE_NAME }}"
          echo "Build Target: ${{ env.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v3

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=Asia/Tokyo
          sudo apt update
          sudo apt-get install -y tzdata
          sudo apt -y upgrade
          sudo apt -y install \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush \
            schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
            qemu-user-static libstdc++-10-dev libncurses5 python3 libtinfo5 \
            openssl python2.7 python2.7-dev git wget xxd python3-cryptography zip curl \
            python3-pycryptodome
            
      - name: Install OpenJDK
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '8'

      - name: Setup SSH Keys
        if: startsWith(env.MANIFEST_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          repo init --depth=1 \
            -u ${{ env.MANIFEST_URL }} \
            -b ${{ env.MANIFEST_BRANCH }}

      - name: Repo Sync
        working-directory: workspace
        run: |
          repo sync -j$(nproc --all) --force-sync

      - name: Move files to workspace
        run: |
          mkdir -p workspace/${{ env.DEVICE_PATH }}
          ls | grep -v workspace | xargs -I{} mv {} workspace/${{ env.DEVICE_PATH }}


      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Switch to Python 2
        run: |
          sudo apt -y install python2
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
          python --version

      - name: Buildi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.MAKEFILE_NAME }}-eng
          make clean
          make fec -j$(nproc --all)
          
      - name: Install built fec to PATH
        run: |
          sudo cp ${{ steps.pwd.outputs.workspace-folder }}/out/host/linux-x86/bin/fec /usr/local/bin/fec
          sudo chmod +x /usr/local/bin/fec
          fec --version || fec --help || true

      - name: Clone avbtool 1.1.0 from AOSP android-9.0.0_r34
        run: git clone --depth 1 --branch android-9.0.0_r34 https://android.googlesource.com/platform/external/avb

      - name: Clone nccgroup test_avb_key
        run: git clone https://github.com/nccgroup/test_avb_key nccgroup-avb

      - name: Clone haha-you-used-testkeys (AOSP testkey)
        run: git clone https://github.com/alltechdev/haha-you-used-testkeys haha-tool

      - name: Download test.7z
        run: wget -O test.7z https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A7%E3%83%BC%E3%81%9F/test.7z

      - name: Extract images
        run: |
          7z x test.7z -o. -aoa -y
          ls -la *.img

      - name: dl
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf boot.img
          wget -O boot.img https://github.com/coara-chocomaru/TAB-A05-BA1-Next-TWRP/releases/download/TAB-A05-BA1-NEXT-TWRP/a05ba-yoko.img

      - name: Create working directories
        run: mkdir -p signed keys

      - name: Deploy vbmeta key (AOSP testkey) and boot key
        run: |
          cp haha-tool/keys/vbmeta.pem keys/vbmeta.pem
          cp haha-tool/keys/boot.pem   keys/boot.pem

      - name: Generate custom keys for system, recovery, vendor, and dtbo
        run: |
          openssl genrsa -out keys/system.pem   2048
          openssl genrsa -out keys/recovery.pem 2048
          openssl genrsa -out keys/vendor.pem   2048
          openssl genrsa -out keys/dtbo.pem     2048

      - name: Extract public keys for all signing keys
        run: |
          for name in boot system recovery vendor dtbo; do
            python avb/avbtool extract_public_key --key keys/${name}.pem --output keys/${name}.avbpubkey
          done

      - name: Set fixed salt for all partitions
        run: echo "FIXED_SALT=70a0876074f1d5f3a4e57148cfbd248855407f3e62236b049f30a5c9d93cfed8" >> $GITHUB_ENV

      - name: Capture original partition sizes
        run: |
          cd $GITHUB_WORKSPACE
          echo "BOOT_PARTITION_SIZE=$(stat -c%s boot.img)" >> $GITHUB_ENV
          echo "RECOVERY_PARTITION_SIZE=$(stat -c%s recovery.img)" >> $GITHUB_ENV
          echo "SYSTEM_PARTITION_SIZE=$(stat -c%s system.img)" >> $GITHUB_ENV
          echo "VENDOR_PARTITION_SIZE=$(stat -c%s vendor.img)" >> $GITHUB_ENV
          echo "DTBO_PARTITION_SIZE=$(stat -c%s dtbo.img)" >> $GITHUB_ENV

      - name: Sign boot.img => signed/boot.img (boot.pem, fixed salt)
        run: |
          cd $GITHUB_WORKSPACE
          cp boot.img signed/sd_boot.img
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/sd_boot.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hash_footer \
            --image signed/sd_boot.img \
            --partition_name sd_boot \
            --partition_size $BOOT_PARTITION_SIZE \
            --hash_algorithm sha256 \
            --key keys/boot.pem \
            --algorithm SHA256_RSA2048

      - name: Sign recovery.img => signed/recovery.img
        run: |
          cd $GITHUB_WORKSPACE
          cp recovery.img signed/sd_recovery.img
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/sd_recovery.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hash_footer \
            --image signed/sd_recovery.img \
            --partition_name sd_recovery \
            --partition_size $RECOVERY_PARTITION_SIZE \
            --hash_algorithm sha256 \
            --key keys/recovery.pem \
            --algorithm SHA256_RSA2048

      - name: Sign system.img => signed/system.img
        run: |
          cd $GITHUB_WORKSPACE
          cp system.img signed/sd_system.img
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/sd_system.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hash_footer \
            --image signed/sd_system.img \
            --partition_name sd_system \
            --partition_size $SYSTEM_PARTITION_SIZE \
            --hash_algorithm sha256 \
            --key keys/system.pem \
            --algorithm SHA256_RSA2048

      - name: Sign vendor.img => signed/vendor.img (hashtree)
        run: |
          cd $GITHUB_WORKSPACE
          cp vendor.img signed/sd_vendor.img
          export HOST_OUT=/home/runner/work/TAB-A05-BA1-Next-TWRP/TAB-A05-BA1-Next-TWRP/workspace/out/host/linux-x86
          export LD_LIBRARY_PATH="$HOST_OUT/lib64:$HOST_OUT/lib:${LD_LIBRARY_PATH}"
          export PATH="$HOST_OUT/bin:${PATH}"
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/sd_vendor.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hashtree_footer \
            --image signed/sd_vendor.img \
            --partition_name sd_vendor \
            --partition_size $VENDOR_PARTITION_SIZE \
            --hash_algorithm sha1 \
            --fec_num_roots 2 \
            --key keys/vendor.pem \
            --algorithm SHA256_RSA2048

      - name: Sign dtbo.img => signed/dtbo.img
        run: |
          cd $GITHUB_WORKSPACE
          cp dtbo.img signed/sd_dtbo.img
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/sd_dtbo.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hash_footer \
            --image signed/sd_dtbo.img \
            --partition_name sd_dtbo \
            --partition_size $DTBO_PARTITION_SIZE \
            --hash_algorithm sha256 \
            --key keys/dtbo.pem \
            --algorithm SHA256_RSA2048

      - name: Build vbmeta image
        run: |
          python avb/avbtool make_vbmeta_image \
            --output signed/vbmeta.img \
            --key keys/vbmeta.pem \
            --algorithm SHA256_RSA2048 \
            --chain_partition sd_boot:3:keys/boot.avbpubkey \
            --chain_partition sd_recovery:1:keys/recovery.avbpubkey \
            --chain_partition sd_system:2:keys/system.avbpubkey \
            --chain_partition sd_vendor:4:keys/vendor.avbpubkey \
            --include_descriptors_from_image signed/sd_vendor.img \
            --include_descriptors_from_image signed/sd_dtbo.img \
            --include_descriptors_from_image signed/sd_boot.img

      - name: Show vbmeta info
        run: |
          python avb/avbtool info_image --image signed/vbmeta.img
          echo "---hexdump---"
          xxd signed/vbmeta.img | head -30

      - name: Verify with nccgroup test_avb_key
        run: python3 nccgroup-avb/test_avb_key.py signed/vbmeta.img
        continue-on-error: true

       
      - name: Install Python2 crypto libs
        run: |
          curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
          python get-pip.py
          python -m pip install --upgrade "pip<21"
          python -m pip install "setuptools<45"
          python -m pip uninstall -y pycryptodome || true
          python -m pip install "pycrypto==2.6.1"
          
      - name: Full AVB chain verification (embedded keys)
        run: |
          python avb/avbtool verify_image \
            --image signed/vbmeta.img \
            --image signed/sd_boot.img \
            --image signed/sd_recovery.img \
            --image signed/sd_system.img \
            --image signed/sd_dtbo.img \
            --image signed/sd_vendor.img \
            --expected_chain_partition sd_boot:3:keys/boot.avbpubkey \
            --expected_chain_partition sd_recovery:1:keys/recovery.avbpubkey \
            --expected_chain_partition sd_system:2:keys/system.avbpubkey \
            --expected_chain_partition sd_vendor:4:keys/vendor.avbpubkey


      - name: Explicit testkey verification
        run: |
          python avb/avbtool verify_image \
            --image signed/vbmeta.img \
            --key keys/vbmeta.pem \
            --expected_chain_partition sd_boot:3:keys/boot.avbpubkey \
            --expected_chain_partition sd_recovery:1:keys/recovery.avbpubkey \
            --expected_chain_partition sd_system:2:keys/system.avbpubkey \
            --expected_chain_partition sd_vendor:4:keys/vendor.avbpubkey

      - name: Zip keys folder
        run: zip -r keys.zip keys/

      - name: Upload keys artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keys
          path: keys.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-all-partitions
          path: |
            signed/vbmeta.img
            signed/sd_boot.img
            signed/sd_recovery.img
            signed/sd_system.img
            signed/sd_dtbo.img
            signed/sd_vendor.img
